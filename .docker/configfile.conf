server {
    listen       $PORT;
    server_name  gb3-frontend;

    access_log  /var/log/nginx/access.log main;
    error_log   /var/log/nginx/error.log;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Hashed, versioned build output (JS/CSS emitted by Angular's outputHashing) -
    # safe to cache for a long time since a new deployment always produces new filenames.
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Fonts are also safe to cache long-term as they rarely change and are not
    # content-hashed in this project, but are effectively immutable in practice.
    location ~* \.(?:woff2?|ttf|eot|otf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Images/icons served from src/assets are copied as-is (not content-hashed), so we
    # can't safely mark them "immutable". Instead we cache long-term but force browsers
    # to revalidate via the ETag/Last-Modified nginx sends automatically: unchanged files
    # get a cheap 304 response, changed files are served fresh immediately.
    location ~* \.(?:png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, must-revalidate" always;
    }

    # index.html must always be revalidated so a new deployment (with new hashed
    # asset filenames) is picked up without requiring a hard-refresh.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";
}
