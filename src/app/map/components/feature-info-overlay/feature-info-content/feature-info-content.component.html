<ng-template #tableHeader let-tableHeader>
  <th
    (mouseenter)="onFeatureHoverStart(tableHeader.fid)"
    (mouseleave)="onFeatureHoverEnd()"
    (click)="toggleHighlightForFeature(tableHeader.fid, tableHeader.hasGeometry)"
    [featureId]="tableHeader.fid"
    [layerId]="layer().layer"
    [topicId]="topicId()"
    class="feature-info-content__table__row__column feature-info-content__table__row__column--header"
    [class.feature-info-content__table__row__column--highlighted]="highlightedFeatureId() === tableHeader.fid"
    scope="col"
    tableColumnIdentifier
  >
    <div class="feature-info-content__table__row__column__wrapper">
      {{ tableHeader.displayValue.split(' ')[1] }}
      <mat-radio-button [disabled]="!tableHeader.hasGeometry" [checked]="highlightedFeatureId() === tableHeader.fid" labelPosition="before">
        Markieren:
      </mat-radio-button>
    </div>
  </th>
</ng-template>

<ng-template #tableCell let-cellValue>
  <td
    (mouseenter)="onFeatureHoverStart(cellValue.fid)"
    (mouseleave)="onFeatureHoverEnd()"
    [featureId]="cellValue.fid"
    [layerId]="layer().layer"
    [topicId]="topicId()"
    class="feature-info-content__table__row__column"
    [class.feature-info-content__table__row__column--highlighted]="highlightedFeatureId() === cellValue.fid"
    tableColumnIdentifier
  >
    @switch (cellValue.cellType) {
      @case ('url') {
        <a
          class="feature-info-content__table__row__column__link"
          [href]="cellValue.url"
          target="_blank"
          rel="noopener noreferrer"
          [title]="cellValue.displayValue"
        >
          {{ cellValue.displayValue }}
        </a>
      }
      @case ('image') {
        <a [href]="cellValue.url" target="_blank" rel="noopener noreferrer" [title]="cellValue.displayValue">
          <img
            class="feature-info-content__table__row__column__image"
            [src]="cellValue.src"
            [alt]="cellValue.alt"
            width="200"
            height="200"
          />
        </a>
      }
      @case ('text') {
        {{ cellValue.displayValue }}
      }
    }
  </td>
</ng-template>

<div class="feature-info-content" #container>
  <mat-radio-group [value]="highlightedFeatureId()">
    <resizable-info-table
      [tableLabel]="`Informationen zu ${this.layer().title}`"
      [tableData]="tableData()"
      [tableHeaderTemplate]="tableHeader"
      [tableCellTemplate]="tableCell"
      [resizeContainer]="container"
      (resizeHandlerResizeStart)="onResizeHandlerResizeStart()"
      (resizeHandlerResizeEnd)="onResizeHandlerResizeEnd()"
    />
  </mat-radio-group>
</div>
