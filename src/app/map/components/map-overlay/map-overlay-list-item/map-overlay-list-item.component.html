<mat-expansion-panel
  #expansionPanel
  [disabled]="disabled()"
  [expanded]="forceExpanded()"
  [class.list-item--no-content-indent]="removeContentIndent()"
  class="list-item"
  hideToggle
>
  <mat-expansion-panel-header class="list-item__header" [class.list-item__header--no-background]="!hasBackgroundColor()">
    <div
      class="list-item__header__content"
      [class.list-item__header__content--level-1]="nestingLevel() === 1"
      [class.list-item__header__content--level-2]="nestingLevel() === 2"
      [class.list-item__header__content--level-3]="nestingLevel() === 3"
    >
      <mat-icon
        [fontIcon]="expansionPanel.expanded ? 'arrow_drop_down' : 'arrow_right'"
        [class.list-item__header__content__toggle--position-end]="toggleButtonPosition() === 'end'"
        class="list-item__header__content__toggle"
      />
      <ng-content select="[header-icon]" />
      <p class="list-item__header__content__title" [matTooltip]="overlayTitle()" showTooltipIfTruncated>
        {{ overlayTitle() }}
      </p>
      @if (metaDataLink() && showInteractiveElements()) {
        <a
          (click)="$event.stopPropagation()"
          class="list-item__header__content__info-link"
          [routerLink]="metaDataLink()"
          title="Metadaten anzeigen"
        >
          <span class="list-item__header__content__info-link__icon">
            <mat-icon svgIcon="ktzh_info" />
          </span>
        </a>
      }
    </div>
  </mat-expansion-panel-header>
  <ng-template matExpansionPanelContent>
    <div
      class="list-item__content"
      [class.list-item__content--has-border]="hasBorder()"
      [class.list-item__content--is-nested]="nestingLevel() > 0"
      [class.list-item__content--level-1]="nestingLevel() === 1"
      [class.list-item__content--level-2]="nestingLevel() === 2"
      [class.list-item__content--level-3]="nestingLevel() === 3"
    >
      <ng-content />
    </div>
  </ng-template>
</mat-expansion-panel>
