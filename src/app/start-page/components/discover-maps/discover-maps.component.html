<content-loading-state
  [loadingState]="loadingState()"
  loadingCompletedText="Fehler beim Laden der Karten zum Entdecken."
  loadingText="Lade neue Karten zum Entdecken..."
/>
<link-grid-list>
  @for (discoverMapsEntry of discoverMapsItems(); track $index) {
    <li
      link-grid-list-item
      [internalLink]="mainPageEnum.Maps"
      [internalQueryParams]="{topics: discoverMapsEntry.mapId}"
      [title]="discoverMapsEntry.title"
      size="large"
      [imageUrl]="discoverMapsEntry.image.url"
    >
      <p>
        {{ discoverMapsEntry.description }}
      </p>
    </li>
  }
</link-grid-list>
@if (discoverMapsItems().length === 0 && loadingState() === 'loaded') {
  <p class="mat-caption">Aktuell gibt es keine Empfehlungen.</p>
}
